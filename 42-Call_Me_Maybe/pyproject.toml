[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["llm-sdk", "numpy", "pydantic"]

[dependency-groups]
dev = ["flake8", "mypy"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ["^llm_sdk/"]
namespace_packages = false
ignore_missing_imports = true
